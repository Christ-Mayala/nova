<!doctype html>
<html lang="fr" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2383e2" />
    <title>NOVA — Hors ligne</title>
    <style>
      :root {
        color-scheme: light dark;
        --fond: #ffffff;
        --texte: #37352f;
        --texte-doux: #73726e;
        --accent: #2383e2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fond: #191919;
          --texte: #e6e6e4;
          --texte-doux: #9b9b98;
          --accent: #4a9eeb;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(1.5rem + env(safe-area-inset-top)) 1.5rem
          calc(1.5rem + env(safe-area-inset-bottom));
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--fond);
        color: var(--texte);
      }
      main {
        width: 100%;
        max-width: 26rem;
        text-align: center;
      }
      img {
        width: 88px;
        height: 88px;
        border-radius: 20px;
        object-fit: contain;
        background: #e6e6e6;
        margin-bottom: 1.5rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        line-height: 1.5;
        color: var(--texte-doux);
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.6rem;
        padding: 0.7rem 1.2rem;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.06);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="NOVA" width="88" height="88" />
      <h1>Vous êtes hors ligne</h1>
      <p>NOVA n’arrive pas à joindre le serveur. Vérifiez votre connexion, puis réessayez.</p>
      <button type="button" onclick="window.location.reload()">Réessayer</button>
    </main>
  </body>
</html>
